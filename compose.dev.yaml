services:
  gateway:
    environment:
      SHORT_LINKS_ENABLED: "true"
      CUSTOM_BACKEND_ENABLED: "true"
      # Local development exercises the embedded store without Cloudflare.
      TURNSTILE_ENABLED: "false"

  subconverter:
    environment:
      SUBCONVERTER_PROFILE: public
      SUBCONVERTER_ENABLE_UPLOADS: "false"
