<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <!-- <title><%= htmlWebpackPlugin.options.title %></title> -->
    <title>Subconverter Web</title>
    <script type="text/javascript">
      (function () {
        var defaultConfig = {
          siteName: 'Subconverter Web',
          apiUrl: 'http://127.0.0.1:25500',
          shortUrl: 'https://s.ops.ci',
          menuItem: [
            { title: '首页', link: '/', target: '' },
            { title: 'GitHub', link: 'https://github.com/stilleshan/subweb', target: '_blank' },
          ],
          remoteConfigOptions: [
            {
              value: 'https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/config/ACL4SSR_Online.ini',
              text: 'ACL4SSR Online',
            },
            {
              value: 'https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/config/ACL4SSR_Online_Full.ini',
              text: 'ACL4SSR Online Full',
            },
          ],
        };

        window.__normalizeSubwebConfig = function (config) {
          config = config && typeof config === 'object' && !Array.isArray(config) ? config : {};

          return {
            siteName: typeof config.siteName === 'string' ? config.siteName : defaultConfig.siteName,
            apiUrl: typeof config.apiUrl === 'string' ? config.apiUrl : defaultConfig.apiUrl,
            shortUrl: typeof config.shortUrl === 'string' ? config.shortUrl : defaultConfig.shortUrl,
            menuItem: Array.isArray(config.menuItem) ? config.menuItem : defaultConfig.menuItem,
            remoteConfigOptions: Array.isArray(config.remoteConfigOptions)
              ? config.remoteConfigOptions
              : defaultConfig.remoteConfigOptions,
          };
        };

        window.config = window.__normalizeSubwebConfig();
      })();
    </script>
    <script
      type="text/javascript"
      src="<%= BASE_URL %>conf/config.js"
    ></script>
    <script type="text/javascript">
      window.config = window.__normalizeSubwebConfig(window.config);
      delete window.__normalizeSubwebConfig;
    </script>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->

    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin="">
    <link href="https://fonts.loli.net/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.loli.net/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.loli.net/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.loli.net/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </body>
</html>
