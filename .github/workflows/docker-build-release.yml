---
name: docker build release

'on':
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing Git tag to build and publish (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: keleyaa/subweb
  GHCR_IMAGE: keleyaa/subweb

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout requested release tag
        id: source
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        shell: bash
        run: |
          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [ "${#VERSION}" -le 128 ] || {
            echo 'version must be at most 128 characters' >&2
            exit 1
          }
          [[ "$VERSION" =~ $semver_pattern ]] || {
            echo 'version must match vX.Y.Z' >&2
            exit 1
          }
          git ls-remote --exit-code origin "refs/tags/$VERSION" >/dev/null || {
            echo "Git tag $VERSION was not found in origin" >&2
            exit 1
          }
          git fetch --depth=1 origin "refs/tags/$VERSION"
          git checkout --detach FETCH_HEAD
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify artifact locks
        run: npm run verify:locks

      - name: Verify production release readiness
        run: node scripts/verify-production-readiness.mjs

      - name: Verify documentation and deployment evidence
        run: npm run verify:docs && npm run verify:evidence

      - name: Create temporary Compose configuration
        run: |
          ./scripts/configure.sh \
            --app-domain app.test \
            --api-domain api.app.test \
            --short-domain short.app.test \
            --turnstile-site-key test-site-key \
            --turnstile-secret-key-stdin <<'EOF'
          test-secret-key
          EOF

      - name: Validate Compose
        run: npm run verify:compose

      - name: Verify Compose-first development flow
        run: npm run verify:local

      - name: Verify Docker-gated tests, lint, and build
        run: npm run verify:ci

      - name: Verify unified production stack
        run: npm run verify:integration

      # Export the exact locked artifacts so integration and vulnerability
      # scans inspect the same images as production defaults.
      - name: Resolve external runtime images
        shell: bash
        run: |
          node scripts/runtime-image-contract.mjs env >> "$GITHUB_ENV"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser workflows
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build final image
        run: docker build --file Dockerfile --tag subweb:ci .

      - name: Scan final image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: "v0.74.0"
          image-ref: subweb:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # Scan each image the compose stack actually pulls so a vulnerable
      # upstream release fails the gate instead of reaching production silently.
      # Kept as three steps because Trivy rejects comma-separated
      # image-reference lists.
      - name: Scan external runtime images (Redis)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: "v0.74.0"
          image-ref: ${{ env.REDIS_IMAGE }}
          trivyignores: .trivyignore.redis
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan external runtime images (SubConverter-Extended)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: "v0.74.0"
          image-ref: ${{ env.SUBCONVERTER_IMAGE }}
          trivyignores: .trivyignore.subconverter
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan external runtime images (MyUrls)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: "v0.74.0"
          image-ref: ${{ env.MYURLS_IMAGE }}
          trivyignores: .trivyignore.myurls
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Remove temporary deployment configuration
        if: always()
        run: rm -f .env

  release:
    needs: quality
    timeout-minutes: 45
    # Publishing only happens for semantic-version tag pushes or an explicit
    # manual run; ordinary branch pushes and pull requests do not trigger
    # this workflow.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set release tags
        id: tag
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          EXPECTED_SOURCE_SHA: ${{ needs.quality.outputs.source_sha }}
        shell: bash
        run: |
          readonly VERSION
          version="$VERSION"
          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [ "${#version}" -le 128 ] || {
            echo 'version must be at most 128 characters' >&2
            exit 1
          }
          [[ "$version" =~ $semver_pattern ]] || {
            echo 'version must match vX.Y.Z' >&2
            exit 1
          }
          git ls-remote --exit-code origin "refs/tags/$version" >/dev/null || {
            echo "Git tag $version was not found in origin" >&2
            exit 1
          }
          git fetch --depth=1 origin "refs/tags/$version"
          git checkout --detach FETCH_HEAD
          source_sha=$(git rev-parse HEAD)
          [[ "$source_sha" == "$EXPECTED_SOURCE_SHA" ]] || {
            printf '%s\n' \
              'Release tag does not match the quality-verified commit' >&2
            exit 1
          }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        # yamllint disable-line rule:line-length
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable candidate
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ env.GHCR_IMAGE }}:${{ steps.tag.outputs.version }}

      # Scan the exact multi-platform artifact before promotion to release tags.
      - name: Scan release candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: "v0.74.0"
          # yamllint disable-line rule:line-length
          image-ref: ghcr.io/${{ env.GHCR_IMAGE }}@${{ steps.image.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Create signed release provenance
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ steps.tag.outputs.version }}
          SOURCE_SHA: ${{ steps.tag.outputs.source_sha }}
        shell: bash
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Docker image digest is missing or malformed" >&2
            exit 1
          }
          jq -n \
            --arg release_tag "$RELEASE_TAG" \
            --arg release_ref "refs/tags/$RELEASE_TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg image_digest "$IMAGE_DIGEST" \
            '{
              schemaVersion: "1",
              releaseTag: $release_tag,
              releaseRef: $release_ref,
              sourceSha: $source_sha,
              imageDigest: $image_digest
            }' > "$RUNNER_TEMP/release-provenance.json"

      - name: Attest release candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          predicate-type: https://keleyaa.dev/subweb/release/v1
          predicate-path: ${{ runner.temp }}/release-provenance.json
          push-to-registry: true
          create-storage-record: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified candidate
        id: promote
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ steps.tag.outputs.version }}
        shell: bash
        run: |
          source="ghcr.io/${GHCR_IMAGE}@${IMAGE_DIGEST}"
          docker buildx imagetools create \
            --tag "docker.io/${DOCKERHUB_IMAGE}:latest" \
            --tag "docker.io/${DOCKERHUB_IMAGE}:${RELEASE_TAG}" \
            --tag "ghcr.io/${GHCR_IMAGE}:latest" \
            --tag "ghcr.io/${GHCR_IMAGE}:${RELEASE_TAG}" \
            "$source"
          for reference in \
            "docker.io/${DOCKERHUB_IMAGE}:latest" \
            "docker.io/${DOCKERHUB_IMAGE}:${RELEASE_TAG}" \
            "ghcr.io/${GHCR_IMAGE}:latest" \
            "ghcr.io/${GHCR_IMAGE}:${RELEASE_TAG}"
          do
            published_digest="$(docker buildx imagetools inspect "$reference" \
              --format '{{.Manifest.Digest}}')"
            [[ "$published_digest" == "$IMAGE_DIGEST" ]] || {
              echo "Published digest mismatch for ${reference}" >&2
              exit 1
            }
          done

      - name: Remove failed release candidate package version
        if: ${{ failure() && steps.promote.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_PACKAGE: subweb
          RELEASE_TAG: ${{ steps.tag.outputs.version }}
        shell: bash
        run: |
          version_ids=$(gh api --paginate \
            "/user/packages/container/${GHCR_PACKAGE}/versions?per_page=100" \
            --jq '
              .[] | select(.metadata.container.tags[]? == env.RELEASE_TAG) | .id
            ')
          while IFS= read -r version_id; do
            [ -n "$version_id" ] || continue
            gh api --method DELETE \
              "/user/packages/container/${GHCR_PACKAGE}/versions/${version_id}"
          done <<< "$version_ids"

      - name: Create rollback manifest
        id: rollback
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ steps.tag.outputs.version }}
          SOURCE_SHA: ${{ steps.tag.outputs.source_sha }}
        shell: bash
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Docker image digest is missing or malformed" >&2
            exit 1
          }
          runtime_images_json=$(node \
            scripts/runtime-image-contract.mjs rollback)
          manifest_path="$RUNNER_TEMP/rollback-manifest.json"
          dockerhub_reference="docker.io/${DOCKERHUB_IMAGE}"'@'"${IMAGE_DIGEST}"
          ghcr_reference="ghcr.io/${GHCR_IMAGE}"'@'"${IMAGE_DIGEST}"
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg release_tag "$RELEASE_TAG" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg dockerhub_reference "$dockerhub_reference" \
            --arg ghcr_reference "$ghcr_reference" \
            --argjson runtime_images "$runtime_images_json" \
            --arg build_time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: "1",
              release_identity: {
                source_sha: $source_sha,
                workflow_run: {
                  id: $run_id,
                  attempt: $run_attempt
                },
                resolved_tag: $release_tag,
                source_digest: $image_digest,
                platforms: ["linux/amd64", "linux/arm64"],
                runtime_images: $runtime_images,
                build_time: $build_time,
                rollback_target: {
                  source_reference: $dockerhub_reference,
                  source_digest: $image_digest,
                  registry_references: {
                    docker_hub: $dockerhub_reference,
                    ghcr: $ghcr_reference
                  }
                }
              }
            }' > "$manifest_path"
           jq -e '
             .release_identity.source_sha and
             .release_identity.source_digest and
              (.release_identity.rollback_target.registry_references |
                .docker_hub) and
             .release_identity.rollback_target.registry_references.ghcr and
             (.release_identity.runtime_images |
               (keys | sort) == ["myurls", "redis", "subconverter"] and
               all(.[]; (
                 (keys | sort) == ["digest", "platforms", "reference"] and
                 ((.reference | type) == "string") and
                 (.reference | test("@sha256:[0-9a-f]{64}$")) and
                 (.digest | test("^sha256:[0-9a-f]{64}$")) and
                 ((.platforms | type) == "object") and
                 (.platforms |
                   has("linux/amd64") and
                   has("linux/arm64") and
                   all(.[]; (
                    type == "string" and test("^sha256:[0-9a-f]{64}$")
                  )))
               ))
             )
           ' "$manifest_path" >/dev/null
          echo "manifest_path=${manifest_path}" >> "$GITHUB_OUTPUT"
          echo "digest_suffix=${IMAGE_DIGEST#sha256:}" >> "$GITHUB_OUTPUT"
          {
            echo "### Container release"
            echo "- Docker Hub: \`${dockerhub_reference}\`"
            echo "- GHCR: \`${ghcr_reference}\`"
            echo "- source: \`${SOURCE_SHA}\`"
            echo "- tag: \`${RELEASE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rollback manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # yamllint disable-line rule:line-length
          name: rollback-manifest-${{ github.run_id }}-${{ steps.rollback.outputs.digest_suffix }}
          path: ${{ steps.rollback.outputs.manifest_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Sync README to Docker Hub
        # yamllint disable-line rule:line-length
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: ./README.md
