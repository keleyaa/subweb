name: docker build release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: keleyaa/subweb
  GHCR_IMAGE: keleyaa/subweb

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Activate the real-nginx Content-Type gate and the Docker integration
      # wrappers that are otherwise skipIf-gated out of every vitest run.
      RUN_NGINX_GATEWAY_TESTS: "1"
      RUN_DOCKER_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify artifact locks
        run: npm run verify:locks

      - name: Verify documentation and deployment evidence
        run: npm run verify:docs && npm run verify:evidence

      - name: Create temporary Compose configuration
        run: ./scripts/configure.sh --app-domain app.test --api-domain api.app.test --short-domain short.app.test --turnstile-site-key test-site-key --turnstile-secret-key test-secret-key

      - name: Validate Compose
        run: npm run verify:compose

      - name: Verify unit tests, lint, and build
        run: npm run verify

      - name: Verify container runtime
        run: npm run verify:container

      - name: Build request policy image
        run: docker compose build request-policy

      # Export the exact locked artifacts so integration and vulnerability
      # scans inspect the same images as production defaults.
      - name: Resolve external runtime images
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('deploy/versions.lock.json', 'utf8'));
          for (const [variable, service] of [
            ['REDIS_IMAGE', 'redis'],
            ['SUBCONVERTER_IMAGE', 'subconverter'],
            ['MYURLS_IMAGE', 'myurls'],
          ]) {
            const image = lock.services[service].image;
            console.log(`${variable}=${image.reference}@${image.digest}`);
          }
          NODE

      - name: Verify integrated HTTP stack
        run: npm run verify:integration

      - name: Verify Redis backup and restore lifecycle
        run: npm run verify:operations

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser workflows
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Scan request policy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: subweb-request-policy:local
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Scan final image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: subweb:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # Scan each image the compose stack actually pulls so a vulnerable
      # upstream release fails the gate instead of reaching production silently.
      # Kept as three steps because trivy rejects comma-separated image-ref lists.
      - name: Scan external runtime images (Redis)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.REDIS_IMAGE }}
          trivyignores: .trivyignore.redis
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan external runtime images (SubConverter-Extended)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.SUBCONVERTER_IMAGE }}
          trivyignores: .trivyignore.subconverter
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan external runtime images (MyUrls)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.MYURLS_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Remove temporary deployment configuration
        if: always()
        run: rm -f .env

  release:
    needs: quality
    # PRs and manual runs on feature branches must not push images: quality
    # gates run everywhere, but publishing stays reserved for main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set release tags
        id: tag
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          date_tag="$(date -u +%Y-%m-%d)-${short_sha}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "date_tag=${date_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable candidate
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ env.GHCR_IMAGE }}:sha-${{ steps.tag.outputs.short_sha }}

      # The exact multi-platform artifact is scanned before any mutable release
      # tag moves. The immutable GHCR sha tag doubles as the promotion source.
      - name: Scan release candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ env.GHCR_IMAGE }}@${{ steps.image.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Promote verified candidate
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ steps.tag.outputs.date_tag }}
          SHORT_SHA: ${{ steps.tag.outputs.short_sha }}
        shell: bash
        run: |
          source="ghcr.io/${GHCR_IMAGE}@${IMAGE_DIGEST}"
          docker buildx imagetools create \
            --tag "docker.io/${DOCKERHUB_IMAGE}:latest" \
            --tag "docker.io/${DOCKERHUB_IMAGE}:${RELEASE_TAG}" \
            --tag "docker.io/${DOCKERHUB_IMAGE}:sha-${SHORT_SHA}" \
            --tag "ghcr.io/${GHCR_IMAGE}:latest" \
            --tag "ghcr.io/${GHCR_IMAGE}:${RELEASE_TAG}" \
            "$source"
          for reference in \
            "docker.io/${DOCKERHUB_IMAGE}:latest" \
            "docker.io/${DOCKERHUB_IMAGE}:${RELEASE_TAG}" \
            "docker.io/${DOCKERHUB_IMAGE}:sha-${SHORT_SHA}" \
            "ghcr.io/${GHCR_IMAGE}:latest" \
            "ghcr.io/${GHCR_IMAGE}:${RELEASE_TAG}" \
            "ghcr.io/${GHCR_IMAGE}:sha-${SHORT_SHA}"
          do
            published_digest="$(docker buildx imagetools inspect "$reference" --format '{{.Manifest.Digest}}')"
            [[ "$published_digest" == "$IMAGE_DIGEST" ]] || {
              echo "Published digest mismatch for ${reference}" >&2
              exit 1
            }
          done

      - name: Create rollback manifest
        id: rollback
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ steps.tag.outputs.date_tag }}
        shell: bash
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Docker image digest is missing or malformed" >&2
            exit 1
          }
          manifest_path="$RUNNER_TEMP/rollback-manifest.json"
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg release_tag "$RELEASE_TAG" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg dockerhub_reference "docker.io/${DOCKERHUB_IMAGE}@${IMAGE_DIGEST}" \
            --arg ghcr_reference "ghcr.io/${GHCR_IMAGE}@${IMAGE_DIGEST}" \
            --arg build_time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: "1",
              release_identity: {
                source_sha: $source_sha,
                workflow_run: {
                  id: $run_id,
                  attempt: $run_attempt
                },
                resolved_tag: $release_tag,
                source_digest: $image_digest,
                platforms: ["linux/amd64", "linux/arm64"],
                build_time: $build_time,
                rollback_target: {
                  source_reference: $dockerhub_reference,
                  source_digest: $image_digest,
                  registry_references: {
                    docker_hub: $dockerhub_reference,
                    ghcr: $ghcr_reference
                  }
                }
              }
            }' > "$manifest_path"
          jq -e '.release_identity.source_sha and .release_identity.source_digest and .release_identity.rollback_target.registry_references.docker_hub and .release_identity.rollback_target.registry_references.ghcr' "$manifest_path" >/dev/null
          echo "manifest_path=${manifest_path}" >> "$GITHUB_OUTPUT"
          echo "digest_suffix=${IMAGE_DIGEST#sha256:}" >> "$GITHUB_OUTPUT"
          {
            echo "### Container release"
            echo "- Docker Hub: \`docker.io/${DOCKERHUB_IMAGE}@${IMAGE_DIGEST}\`"
            echo "- GHCR: \`ghcr.io/${GHCR_IMAGE}@${IMAGE_DIGEST}\`"
            echo "- source: \`${GITHUB_SHA}\`"
            echo "- tag: \`${RELEASE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rollback manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rollback-manifest-${{ github.run_id }}-${{ steps.rollback.outputs.digest_suffix }}
          path: ${{ steps.rollback.outputs.manifest_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: ./README.md
