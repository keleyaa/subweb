name: docker build release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: keleyaa/subweb
  GHCR_IMAGE: keleyaa/subweb

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Activate the real-nginx Content-Type gate and the Docker integration
      # wrappers that are otherwise skipIf-gated out of every vitest run.
      RUN_NGINX_GATEWAY_TESTS: "1"
      RUN_DOCKER_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify artifact locks
        run: npm run verify:locks

      - name: Verify documentation and deployment evidence
        run: npm run verify:docs && npm run verify:evidence

      - name: Create temporary Compose configuration
        run: ./scripts/configure.sh --mode behind-proxy --app-domain app.test --api-domain api.app.test

      - name: Validate Compose
        run: npm run verify:compose

      - name: Verify unit tests, lint, and build
        run: npm run verify

      - name: Verify container runtime
        run: npm run verify:container

      - name: Verify integrated behind-proxy stack
        run: npm run verify:integration:behind-proxy

      - name: Verify Redis backup and restore lifecycle
        run: npm run verify:operations

      - name: Verify integrated direct-tls stack
        run: npm run verify:integration:direct-tls

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser workflows
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Scan final image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: subweb:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Remove temporary deployment configuration
        if: always()
        run: rm -f .env

  release:
    needs: quality
    # PRs and manual runs on feature branches must not push images: quality
    # gates run everywhere, but publishing stays reserved for main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set release tags
        id: tag
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          date_tag="$(date -u +%Y-%m-%d)-${short_sha}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "date_tag=${date_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5

      - name: Login to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            docker.io/${{ env.DOCKERHUB_IMAGE }}:latest
            docker.io/${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.date_tag }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}:sha-${{ steps.tag.outputs.short_sha }}
            ghcr.io/${{ env.GHCR_IMAGE }}:latest
            ghcr.io/${{ env.GHCR_IMAGE }}:${{ steps.tag.outputs.date_tag }}
            ghcr.io/${{ env.GHCR_IMAGE }}:sha-${{ steps.tag.outputs.short_sha }}

      - name: Create rollback manifest
        id: rollback
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ steps.tag.outputs.date_tag }}
        shell: bash
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Docker image digest is missing or malformed" >&2
            exit 1
          }
          manifest_path="$RUNNER_TEMP/rollback-manifest.json"
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg release_tag "$RELEASE_TAG" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg dockerhub_reference "docker.io/${DOCKERHUB_IMAGE}@${IMAGE_DIGEST}" \
            --arg ghcr_reference "ghcr.io/${GHCR_IMAGE}@${IMAGE_DIGEST}" \
            --arg build_time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: "1",
              release_identity: {
                source_sha: $source_sha,
                workflow_run: {
                  id: $run_id,
                  attempt: $run_attempt
                },
                resolved_tag: $release_tag,
                source_digest: $image_digest,
                platforms: ["linux/amd64", "linux/arm64"],
                build_time: $build_time,
                rollback_target: {
                  source_reference: $dockerhub_reference,
                  source_digest: $image_digest,
                  registry_references: {
                    docker_hub: $dockerhub_reference,
                    ghcr: $ghcr_reference
                  }
                }
              }
            }' > "$manifest_path"
          jq -e '.release_identity.source_sha and .release_identity.source_digest and .release_identity.rollback_target.registry_references.docker_hub and .release_identity.rollback_target.registry_references.ghcr' "$manifest_path" >/dev/null
          echo "manifest_path=${manifest_path}" >> "$GITHUB_OUTPUT"
          echo "digest_suffix=${IMAGE_DIGEST#sha256:}" >> "$GITHUB_OUTPUT"
          {
            echo "### Container release"
            echo "- Docker Hub: \`docker.io/${DOCKERHUB_IMAGE}@${IMAGE_DIGEST}\`"
            echo "- GHCR: \`ghcr.io/${GHCR_IMAGE}@${IMAGE_DIGEST}\`"
            echo "- source: \`${GITHUB_SHA}\`"
            echo "- tag: \`${RELEASE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rollback manifest
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: rollback-manifest-${{ github.run_id }}-${{ steps.rollback.outputs.digest_suffix }}
          path: ${{ steps.rollback.outputs.manifest_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Sync README to Docker Hub
        uses: ms-jpq/sync-dockerhub-readme@e2991ea1ba48832e73555cdbd5b82f5a2e91ee9b
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme: ./README.md
