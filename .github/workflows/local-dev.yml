name: local development contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compose-first:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify Compose-first development flow
        run: ./scripts/verify-local-dev.sh
      - name: Stop local dependencies
        if: always()
        run: ./scripts/local/stop.sh
