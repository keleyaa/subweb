name: subweb

x-runtime-environment: &runtime-environment
  TZ: Asia/Shanghai

x-runtime-logging: &runtime-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-runtime-security: &runtime-security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  stop_grace_period: 10s
  logging: *runtime-logging

x-myurls-common: &myurls-common
  <<: *runtime-security
  user: "10001:10001"
  depends_on:
    redis:
      condition: service_healthy
      restart: true
  tmpfs:
    - /tmp:uid=10001,gid=10001,mode=0700,noexec,nosuid,size=16m
  stop_grace_period: 20s
  healthcheck:
    test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://127.0.0.1:3000/health/live
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s

x-gateway-common: &gateway-common
  <<: *runtime-security
  build:
    context: .
  image: "${SUBWEB_IMAGE:-subweb:local}"
  user: "101:101"
  environment: &gateway-environment
    <<: *runtime-environment
    API_URL: "${API_URL:?Set API_URL with scripts/configure.sh}"
    APP_DOMAIN: "${APP_DOMAIN:?Set APP_DOMAIN with scripts/configure.sh}"
    API_DOMAIN: "${API_DOMAIN:?Set API_DOMAIN with scripts/configure.sh}"
    SHORT_DOMAIN: "${SHORT_DOMAIN:?Set SHORT_DOMAIN with scripts/configure.sh}"
    TRUSTED_PROXY_CIDR: "${TRUSTED_PROXY_CIDR:-}"
    SUBCONVERTER_UPSTREAM: http://request-policy:25501
    # These aliases exist only on myurls-edge, so Gateway cannot accidentally
    # reach MyUrls through the default network and lose the trusted source IP.
    MYURLS_APP_UPSTREAM: http://myurls-app-edge:3000
    MYURLS_SHORT_UPSTREAM: http://myurls-short-edge:3000
    MYURLS_MAX_BODY_BYTES: "16384"
  depends_on:
    myurls-app:
      condition: service_healthy
      restart: true
    myurls-short:
      condition: service_healthy
      restart: true
    subconverter:
      condition: service_healthy
      restart: true
    request-policy:
      condition: service_healthy
      restart: true
  tmpfs:
    - /tmp:uid=101,gid=101,mode=0700
    - /usr/share/nginx/html/conf:uid=101,gid=101,mode=0700
  networks:
    default: {}
    myurls-edge:
      ipv4_address: "${MYURLS_GATEWAY_IP:-172.30.255.2}"
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        wget -q -O /dev/null --header="Host: $${APP_DOMAIN}" http://127.0.0.1:8080/healthz
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  redis:
    <<: *runtime-security
    image: "${REDIS_IMAGE:-docker.io/library/redis:8.10.1@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5}"
    user: "999:1000"
    environment:
      <<: *runtime-environment
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD with scripts/configure.sh}"
    command:
      - /bin/sh
      - -eu
      - -c
      - >-
        awk '{ gsub(/@@REDIS_PASSWORD@@/, ENVIRON["REDIS_PASSWORD"]); print }'
        /etc/redis/redis.conf.template > /run/redis/redis.conf &&
        exec redis-server /run/redis/redis.conf
    volumes:
      - redis-data:/data
      - type: bind
        source: ./deploy/redis/redis.conf.template
        target: /etc/redis/redis.conf.template
        read_only: true
    tmpfs:
      - /run/redis:uid=999,gid=1000,mode=0700
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  myurls-app:
    <<: *myurls-common
    image: "${MYURLS_IMAGE:-ghcr.io/keleyaa/myurls:v2.0.4@sha256:a6b8d44ef40d37098a7ca6001f782fedc9d1d882a3e4fa8d28420dd5f6b7e64d}"
    environment:
      <<: *runtime-environment
      NODE_ENV: production
      LOG_LEVEL: "${MYURLS_LOG_LEVEL:-info}"
      APP_PORT: "3000"
      # Both instances return the dedicated short-link origin in created links.
      PUBLIC_BASE_URL: "https://${SHORT_DOMAIN:?Set SHORT_DOMAIN with scripts/configure.sh}"
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD with scripts/configure.sh}"
      IP_HASH_SECRET: "${IP_HASH_SECRET:?Set IP_HASH_SECRET with scripts/configure.sh}"
      TRUST_PROXY_CIDRS: "${MYURLS_TRUST_PROXY_CIDR:-172.30.255.2/32}"
      TURNSTILE_ENABLED: "true"
      TURNSTILE_MODE: cloudflare
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:?Set TURNSTILE_SITE_KEY with scripts/configure.sh}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY with scripts/configure.sh}"
      CREATE_DIRECT_LIMIT_10M: "5"
      CREATE_HARD_LIMIT_10M: "20"
      CREATE_HARD_LIMIT_1D: "100"
      RESOLVE_LIMIT_10S: "600"
      RISK_CHALLENGE_SCORE: "3"
      RISK_BLOCK_SCORE: "8"
      REDIS_TIMEOUT_MS: "750"
      TURNSTILE_TIMEOUT_MS: "2500"
      REQUEST_TIMEOUT_MS: "10000"
      SHUTDOWN_TIMEOUT_MS: "10000"
      TURNSTILE_HOSTNAME: "${APP_DOMAIN:?Set APP_DOMAIN with scripts/configure.sh}"
    networks:
      default: {}
      myurls-edge:
        ipv4_address: "${MYURLS_APP_IP:-172.30.255.3}"
        aliases:
          - myurls-app-edge

  myurls-short:
    <<: *myurls-common
    image: "${MYURLS_IMAGE:-ghcr.io/keleyaa/myurls:v2.0.4@sha256:a6b8d44ef40d37098a7ca6001f782fedc9d1d882a3e4fa8d28420dd5f6b7e64d}"
    environment:
      <<: *runtime-environment
      NODE_ENV: production
      LOG_LEVEL: "${MYURLS_LOG_LEVEL:-info}"
      APP_PORT: "3000"
      # Both instances return the dedicated short-link origin in created links.
      PUBLIC_BASE_URL: "https://${SHORT_DOMAIN:?Set SHORT_DOMAIN with scripts/configure.sh}"
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD with scripts/configure.sh}"
      IP_HASH_SECRET: "${IP_HASH_SECRET:?Set IP_HASH_SECRET with scripts/configure.sh}"
      TRUST_PROXY_CIDRS: "${MYURLS_TRUST_PROXY_CIDR:-172.30.255.2/32}"
      TURNSTILE_ENABLED: "true"
      TURNSTILE_MODE: cloudflare
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:?Set TURNSTILE_SITE_KEY with scripts/configure.sh}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY with scripts/configure.sh}"
      CREATE_DIRECT_LIMIT_10M: "5"
      CREATE_HARD_LIMIT_10M: "20"
      CREATE_HARD_LIMIT_1D: "100"
      RESOLVE_LIMIT_10S: "600"
      RISK_CHALLENGE_SCORE: "3"
      RISK_BLOCK_SCORE: "8"
      REDIS_TIMEOUT_MS: "750"
      TURNSTILE_TIMEOUT_MS: "2500"
      REQUEST_TIMEOUT_MS: "10000"
      SHUTDOWN_TIMEOUT_MS: "10000"
      TURNSTILE_HOSTNAME: "${SHORT_DOMAIN:?Set SHORT_DOMAIN with scripts/configure.sh}"
    networks:
      default: {}
      myurls-edge:
        ipv4_address: "${MYURLS_SHORT_IP:-172.30.255.4}"
        aliases:
          - myurls-short-edge

  subconverter:
    # The pinned upstream process still requires root, while a runtime volume
    # makes /base writable without making the root filesystem writable.
    <<: *runtime-security
    image: "${SUBCONVERTER_IMAGE:-ghcr.io/aethersailor/subconverter-extended:v1.8.6@sha256:5986d0db938d85482185e51b55be3a0326e56c1ba3e3f8326895e89f31804475}"
    environment:
      <<: *runtime-environment
      MANAGED_CONFIG_PREFIX: "${API_URL:?Set API_URL with scripts/configure.sh}"
      SUBCONVERTER_SECURITY_PROFILE: public
      SUBCONVERTER_ALLOW_PUBLIC_UPLOAD: "false"
      # All remote HTTPS config fetches are forced through request-policy's
      # internal CONNECT proxy. This container has no external network route.
      HTTPS_PROXY: http://request-policy:25502
      https_proxy: http://request-policy:25502
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    networks:
      subconverter-egress: {}
    volumes:
      - subconverter-runtime:/base
      # Prefer IPv4 for SubConverter's glibc/libcurl requests when the Docker
      # host resolves IPv6 but has no functional IPv6 egress route.
      - type: bind
        source: ./deploy/subconverter/gai.conf
        target: /etc/gai.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/subconverter-docker-entrypoint.sh
        target: /usr/local/bin/subweb-subconverter-entrypoint
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/subconverter-log-supervisor.sh
        target: /usr/local/bin/subweb-log-supervisor
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/subconverter-log-filter.awk
        target: /usr/local/bin/subweb-log-filter.awk
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /run/subconverter:mode=0700
    command:
      - /bin/sh
      - /usr/local/bin/subweb-subconverter-entrypoint
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:25500/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  request-policy:
    <<: *runtime-security
    build:
      context: ./services/request-policy
    image: "${REQUEST_POLICY_IMAGE:-subweb-request-policy:local}"
    user: "node"
    environment:
      <<: *runtime-environment
      PORT: "25501"
      EGRESS_PROXY_PORT: "25502"
      CONVERSION_EGRESS_CONNECT_TIMEOUT_MS: "${CONVERSION_EGRESS_CONNECT_TIMEOUT_MS:-5000}"
      SUBCONVERTER_UPSTREAM: http://subconverter:25500
      REDIS_URL: redis://redis:6379/1
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD with scripts/configure.sh}"
      IP_HASH_SECRET: "${IP_HASH_SECRET:?Set IP_HASH_SECRET with scripts/configure.sh}"
      CONVERSION_RATE_LIMIT: "${CONVERSION_RATE_LIMIT:-10}"
      CONVERSION_RATE_WINDOW_SECONDS: "${CONVERSION_RATE_WINDOW_SECONDS:-60}"
      CONVERSION_MAX_REQUEST_BYTES: "${CONVERSION_MAX_REQUEST_BYTES:-16384}"
      CONVERSION_MAX_RESPONSE_BYTES: "${CONVERSION_MAX_RESPONSE_BYTES:-8388608}"
      CONVERSION_REQUEST_TIMEOUT_MS: "${CONVERSION_REQUEST_TIMEOUT_MS:-10000}"
      CONVERSION_DNS_TIMEOUT_MS: "${CONVERSION_DNS_TIMEOUT_MS:-2000}"
      CONVERSION_MAX_CONCURRENCY: "${CONVERSION_MAX_CONCURRENCY:-2}"
    depends_on:
      redis:
        condition: service_healthy
        restart: true
      subconverter:
        condition: service_healthy
        restart: true
    networks:
      default: {}
      subconverter-egress: {}
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700,noexec,nosuid,size=16m
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:25501/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    <<: *gateway-common
    ports:
      - "127.0.0.1:${SUBWEB_PORT:-18080}:8080"

volumes:
  redis-data:
  subconverter-runtime:

networks:
  subconverter-egress:
    internal: true
  myurls-edge:
    internal: true
    ipam:
      config:
        - subnet: "${MYURLS_NETWORK_SUBNET:-172.30.255.0/29}"
