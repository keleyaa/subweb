name: subweb

x-runtime-environment: &runtime-environment
  TZ: Asia/Shanghai

x-runtime-logging: &runtime-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-runtime-security: &runtime-security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  stop_grace_period: 10s
  logging: *runtime-logging

services:
  gateway:
    extends:
      file: compose.common-services.yaml
      service: gateway
    environment:
      EGRESS_RESTRICTED_LISTEN_ADDR: "0.0.0.0:25503"
      EGRESS_ALLOWED_HOSTS: "${EGRESS_ALLOWED_HOSTS:-challenges.cloudflare.com}"
      SHORT_DOMAIN: "${SHORT_DOMAIN:?Set SHORT_DOMAIN with scripts/configure.sh}"
      SHORT_LINKS_ENABLED: "true"
      # The embedded short-link store: no external MyUrls or Redis process.
      SHORT_LINK_DB_PATH: /data/links.db
      SHORT_LINK_TTL_SECONDS: "${SHORT_LINK_TTL_SECONDS:-7776000}"
      SHORT_LINK_CREATE_LIMIT_10M: "${SHORT_LINK_CREATE_LIMIT_10M:-20}"
      SHORT_LINK_DAILY_LIMIT: "${SHORT_LINK_DAILY_LIMIT:-100}"
      SHORT_LINK_RESOLVE_LIMIT_10S: "${SHORT_LINK_RESOLVE_LIMIT_10S:-600}"
      IP_HASH_SECRET: "${IP_HASH_SECRET:?Set IP_HASH_SECRET with scripts/configure.sh}"
      TURNSTILE_ENABLED: "true"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:?Set TURNSTILE_SITE_KEY with scripts/configure.sh}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY with scripts/configure.sh}"
      TURNSTILE_TIMEOUT_MS: "2500"
    volumes:
      - links-data:/data

  subconverter:
    extends:
      file: compose.common-services.yaml
      service: subconverter

volumes:
  links-data:
  subconverter-runtime:

networks:
  subconverter-egress:
    internal: true
