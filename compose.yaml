name: subweb

x-runtime-environment: &runtime-environment
  TZ: Asia/Shanghai

x-runtime-logging: &runtime-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-runtime-security: &runtime-security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  stop_grace_period: 10s
  logging: *runtime-logging

x-myurls-common: &myurls-common
  <<: *runtime-security
  user: "10001:10001"
  depends_on:
    redis:
      condition: service_healthy
      restart: true
  tmpfs:
    - /tmp:uid=10001,gid=10001,mode=0700,noexec,nosuid,size=16m
  healthcheck:
    test: [CMD, curl, --fail, --silent, "http://127.0.0.1:3000/health/live"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  gateway:
    <<: *runtime-security
    build:
      context: .
      dockerfile: Dockerfile
    image: "${SUBWEB_IMAGE:-subweb:local}"
    user: "65532:65532"
    environment:
      <<: *runtime-environment
      LISTEN_ADDR: "0.0.0.0:8080"
      EGRESS_LISTEN_ADDR: "0.0.0.0:25502"
      EGRESS_RESTRICTED_LISTEN_ADDR: "0.0.0.0:25503"
      EGRESS_ALLOWED_HOSTS: "${EGRESS_ALLOWED_HOSTS:-challenges.cloudflare.com}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      API_URL: "${API_URL:?Set API_URL with scripts/configure.sh}"
      APP_DOMAIN: "${APP_DOMAIN:?Set APP_DOMAIN with scripts/configure.sh}"
      API_DOMAIN: "${API_DOMAIN:?Set API_DOMAIN with scripts/configure.sh}"
      SHORT_DOMAIN: "${SHORT_DOMAIN:?Set SHORT_DOMAIN with scripts/configure.sh}"
      SHORT_LINKS_ENABLED: "${SHORT_LINKS_ENABLED:-true}"
      CUSTOM_BACKEND_ENABLED: "${CUSTOM_BACKEND_ENABLED:-true}"
      TRUSTED_PROXY_CIDR: "${TRUSTED_PROXY_CIDR:-}"
      SUBCONVERTER_UPSTREAM: http://subconverter:25500
      MYURLS_UPSTREAM: http://myurls-edge:3000
      REDIS_URL: redis://redis:6379/1
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD with scripts/configure.sh}"
      IP_HASH_SECRET: "${IP_HASH_SECRET:?Set IP_HASH_SECRET with scripts/configure.sh}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:?Set TURNSTILE_SITE_KEY with scripts/configure.sh}"
      CONVERSION_RATE_LIMIT: "${CONVERSION_RATE_LIMIT:-10}"
      CONVERSION_RATE_WINDOW_SECONDS: "${CONVERSION_RATE_WINDOW_SECONDS:-60}"
      CONVERSION_MAX_REQUEST_BYTES: "${CONVERSION_MAX_REQUEST_BYTES:-16384}"
      CONVERSION_MAX_RESPONSE_BYTES: "${CONVERSION_MAX_RESPONSE_BYTES:-8388608}"
      CONVERSION_REQUEST_TIMEOUT_MS: "${CONVERSION_REQUEST_TIMEOUT_MS:-10000}"
      CONVERSION_DNS_TIMEOUT_MS: "${CONVERSION_DNS_TIMEOUT_MS:-2000}"
      CONVERSION_EGRESS_CONNECT_TIMEOUT_MS: "${CONVERSION_EGRESS_CONNECT_TIMEOUT_MS:-5000}"
      CONVERSION_MAX_CONCURRENCY: "${CONVERSION_MAX_CONCURRENCY:-4}"
      CONVERSION_MAX_CONCURRENCY_PER_IP: "${CONVERSION_MAX_CONCURRENCY_PER_IP:-2}"
    depends_on:
      redis:
        condition: service_healthy
        restart: true
      myurls:
        condition: service_healthy
        restart: true
    networks:
      default: {}
      redis-policy: {}
      myurls-edge:
        ipv4_address: "${MYURLS_GATEWAY_IP:-172.30.255.2}"
      subconverter-egress: {}
    ports:
      - "127.0.0.1:${SUBWEB_PORT:-18080}:8080"
    healthcheck:
      test: [CMD, /app/gateway, --healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    <<: *runtime-security
    image: "${REDIS_IMAGE:-docker.io/library/redis:8.10.1@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5}"
    user: "999:1000"
    environment:
      <<: *runtime-environment
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD with scripts/configure.sh}"
    command:
      - /bin/sh
      - -eu
      - -c
      - >-
        awk '{ gsub(/@@REDIS_PASSWORD@@/, ENVIRON["REDIS_PASSWORD"]); print }'
        /etc/redis/redis.conf.template > /run/redis/redis.conf &&
        exec redis-server /run/redis/redis.conf
    volumes:
      - redis-data:/data
      - type: bind
        source: ./deploy/redis/redis.conf.template
        target: /etc/redis/redis.conf.template
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /run/redis:uid=999,gid=1000,mode=0700
    networks:
      myurls-data: {}
      redis-policy: {}
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  myurls:
    <<: *myurls-common
    image: "${MYURLS_IMAGE:-ghcr.io/keleyaa/myurls:v2.0.8@sha256:441aed70342b9071f4f64bdbb6fe7d659774c23f1f8bfd3db76c33936eb01d36}"
    environment:
      <<: *runtime-environment
      NODE_ENV: production
      # MyUrls 的 info 级别会为每次健康探测写一行，且无法按路由过滤；短链请求的
      # 正常记录由 Gateway 访问日志提供。需要排查时可用 MYURLS_LOG_LEVEL=info。
      LOG_LEVEL: "${MYURLS_LOG_LEVEL:-warn}"
      APP_PORT: "3000"
      # MyUrls has no direct public network. Turnstile siteverify is the only
      # outbound call and it uses the Gateway's host-allowlisted CONNECT
      # listener, so a compromised MyUrls cannot reach arbitrary hosts.
      HTTPS_PROXY: "http://gateway:25503"
      https_proxy: "http://gateway:25503"
      NO_PROXY: "127.0.0.1,localhost"
      no_proxy: "127.0.0.1,localhost"
      PUBLIC_BASE_URL: "https://${SHORT_DOMAIN:?Set SHORT_DOMAIN with scripts/configure.sh}"
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD with scripts/configure.sh}"
      IP_HASH_SECRET: "${IP_HASH_SECRET:?Set IP_HASH_SECRET with scripts/configure.sh}"
      TRUST_PROXY_CIDRS: "${MYURLS_TRUST_PROXY_CIDR:-172.30.255.2/32}"
      TURNSTILE_ENABLED: "true"
      TURNSTILE_MODE: cloudflare
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:?Set TURNSTILE_SITE_KEY with scripts/configure.sh}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY with scripts/configure.sh}"
      TURNSTILE_HOSTNAME: "${APP_DOMAIN:?Set APP_DOMAIN with scripts/configure.sh}"
      CREATE_DIRECT_LIMIT_10M: "5"
      CREATE_HARD_LIMIT_10M: "20"
      CREATE_HARD_LIMIT_1D: "100"
      RESOLVE_LIMIT_10S: "600"
      RISK_CHALLENGE_SCORE: "3"
      RISK_BLOCK_SCORE: "8"
      REDIS_TIMEOUT_MS: "750"
      TURNSTILE_TIMEOUT_MS: "2500"
      REQUEST_TIMEOUT_MS: "10000"
      SHUTDOWN_TIMEOUT_MS: "10000"
    networks:
      myurls-data: {}
      myurls-edge:
        ipv4_address: "${MYURLS_IP:-172.30.255.3}"
        aliases: [myurls-edge]

  subconverter:
    <<: *runtime-security
    image: "${SUBCONVERTER_IMAGE:-ghcr.io/aethersailor/subconverter-extended:v1.9.4@sha256:8e067383d26d6f3580e9255e13f11a83fd3500e9a3380eb69ae99af54c29f423}"
    # Bootstrap the copied named volume, then the entrypoint execs as UID 101.
    user: "0:0"
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    environment:
      <<: *runtime-environment
      MANAGED_CONFIG_PREFIX: "${API_URL:?Set API_URL with scripts/configure.sh}"
      SUBCONVERTER_SECURITY_PROFILE: public
      SUBCONVERTER_ALLOW_PUBLIC_UPLOAD: "false"
      HTTPS_PROXY: http://gateway:25502
      https_proxy: http://gateway:25502
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    depends_on:
      gateway:
        condition: service_healthy
        restart: true
    networks:
      subconverter-egress: {}
    volumes:
      - subconverter-runtime:/base
      - type: bind
        source: ./deploy/subconverter/gai.conf
        target: /etc/gai.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/subconverter/passwd
        target: /etc/passwd
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/subconverter/group
        target: /etc/group
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/subconverter-docker-entrypoint.sh
        target: /usr/local/bin/subweb-subconverter-entrypoint
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/subconverter-log-supervisor.sh
        target: /usr/local/bin/subweb-log-supervisor
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/subconverter-log-filter.awk
        target: /usr/local/bin/subweb-log-filter.awk
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /run/subconverter:uid=101,gid=101,mode=0700
    command: [/bin/sh, /usr/local/bin/subweb-subconverter-entrypoint]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:25500/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  redis-data:
  subconverter-runtime:

networks:
  subconverter-egress:
    internal: true
  myurls-data:
    internal: true
  redis-policy:
    internal: true
  myurls-edge:
    internal: true
    ipam:
      config:
        - subnet: "${MYURLS_NETWORK_SUBNET:-172.30.255.0/29}"
