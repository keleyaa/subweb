<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Subconverter Web request paths</title>
  <desc id="desc">The browser reaches APP_DOMAIN and API_DOMAIN through one gateway. Subscription conversion routes to SubConverter. Short-link creation and redirects route to MyUrls, which persists mappings in Redis. Credentials stay on the server.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F7FF"/>
      <stop offset="1" stop-color="#EEF2FC"/>
    </linearGradient>
    <linearGradient id="flow" x1="206" y1="0" x2="1090" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1769FF"/>
      <stop offset="0.58" stop-color="#417DDB"/>
      <stop offset="1" stop-color="#7257D6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#417DDB"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="26" fill="url(#ground)"/>
  <rect x="1" y="1" width="1198" height="518" rx="25" fill="none" stroke="#5D739B" stroke-opacity="0.22" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="54" y="68" fill="#12192A" font-size="42" font-weight="750">One gateway. Explicit boundaries.</text>
    <text x="54" y="107" fill="#59667D" font-size="24" font-weight="560">一个公网入口，转换、短链与数据各守其边界</text>
    <text x="1146" y="68" text-anchor="end" fill="#1769FF" font-size="19" font-weight="700" letter-spacing="1.5">TOKEN STAYS SERVER-SIDE</text>
  </g>

  <path d="M205 239H325M475 204H590M475 274H590M756 204H846M756 274H846M1012 274H1090" fill="none" stroke="url(#flow)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(54 171)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect width="150" height="136" rx="18" fill="#FFFFFF" stroke="#A9BBDD" stroke-width="2"/>
    <path d="M39 48H111M39 66H91" stroke="#1769FF" stroke-width="5" stroke-linecap="round"/>
    <text x="75" y="106" text-anchor="middle" fill="#12192A" font-size="23" font-weight="700">Browser</text>
  </g>

  <g transform="translate(326 158)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="150" height="162" rx="18" fill="#FFFFFF" stroke="#86A8E8" stroke-width="2"/>
    <text x="75" y="50" text-anchor="middle" fill="#1769FF" font-size="19" font-weight="700">APP_DOMAIN</text>
    <path d="M24 75H126" stroke="#CFD9EA" stroke-width="2"/>
    <text x="75" y="111" text-anchor="middle" fill="#7257D6" font-size="19" font-weight="700">API_DOMAIN</text>
    <text x="75" y="143" text-anchor="middle" fill="#657087" font-size="16">PUBLIC</text>
  </g>

  <g transform="translate(590 158)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect width="166" height="162" rx="18" fill="#152037" stroke="#6F9FFF" stroke-width="2"/>
    <path d="M83 37V99M55 68H111" stroke="#6F9FFF" stroke-width="5" stroke-linecap="round"/>
    <text x="83" y="132" text-anchor="middle" fill="#F2F5FF" font-size="24" font-weight="700">Gateway</text>
  </g>

  <g transform="translate(846 143)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="166" height="76" rx="14" fill="#E8F7FA" stroke="#55AEB9" stroke-width="2"/>
    <text x="83" y="35" text-anchor="middle" fill="#174C55" font-size="19" font-weight="700">SubConverter</text>
    <text x="83" y="58" text-anchor="middle" fill="#477078" font-size="15">CONVERT</text>
    <rect y="115" width="166" height="76" rx="14" fill="#F0EBFF" stroke="#8E76D8" stroke-width="2"/>
    <text x="83" y="149" text-anchor="middle" fill="#3C2C70" font-size="20" font-weight="700">MyUrls</text>
    <text x="83" y="173" text-anchor="middle" fill="#67558F" font-size="15">SHORTEN · REDIRECT</text>
  </g>

  <g transform="translate(1090 258)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="76" height="76" rx="38" fill="#E9F0FF" stroke="#7095D9" stroke-width="2"/>
    <path d="M20 29C20 21 56 21 56 29V49C56 57 20 57 20 49ZM20 29C20 37 56 37 56 29M20 39C20 47 56 47 56 39" fill="none" stroke="#356CCB" stroke-width="3"/>
    <text x="38" y="101" text-anchor="middle" fill="#39465B" font-size="17" font-weight="700">Redis</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="650">
    <text x="532" y="187" text-anchor="middle" fill="#4A70B5">HOST ROUTING</text>
    <text x="532" y="303" text-anchor="middle" fill="#7257D6">TOKEN INJECTION</text>
    <text x="800" y="187" text-anchor="middle" fill="#337A84">/sub</text>
    <text x="800" y="303" text-anchor="middle" fill="#7257D6">/short</text>
  </g>

  <rect x="54" y="374" width="1092" height="62" rx="14" fill="#FFFFFF" fill-opacity="0.74" stroke="#A9BBDD" stroke-opacity="0.6"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="650">
    <text x="80" y="412" fill="#1769FF">APP</text>
    <text x="134" y="412" fill="#59667D">UI · /short-api/short · /:shortKey</text>
    <text x="566" y="412" fill="#7257D6">API</text>
    <text x="620" y="412" fill="#59667D">/sub · /healthz</text>
    <text x="924" y="412" fill="#1F7A35">PRIVATE</text>
    <text x="1012" y="412" fill="#59667D">no ports</text>
  </g>
</svg>
