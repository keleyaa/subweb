<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Subconverter Web - Self-hosted subscription delivery</title>
  <desc id="desc">A self-hosted stack for subscription conversion and short links. The visual traces input to convert to share.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="0.56" stop-color="#F5F8FF"/>
      <stop offset="1" stop-color="#F7F3FF"/>
    </linearGradient>
    <linearGradient id="flow" x1="660" y1="122" x2="1124" y2="266" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="halo" x1="1032" y1="4" x2="850" y2="342" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4EAFE" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#EEE7FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#surface)"/>
  <path d="M0 284C214 226 401 250 578 316V360H0Z" fill="#E9F0FF"/>
  <circle cx="1076" cy="18" r="250" fill="url(#halo)"/>
  <path d="M64 284H566" stroke="#D5E1F5" stroke-width="2"/>

  <g id="title-block" transform="translate(64 58)">
    <rect width="370" height="40" rx="20" fill="#E8F0FF"/>
    <circle cx="21" cy="20" r="7" fill="#2563EB"/>
    <text x="42" y="28" fill="#2563EB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24" font-weight="700" letter-spacing="1.2">SELF-HOSTED DELIVERY</text>

    <text x="0" y="112" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="56" font-weight="750">Subconverter Web</text>
    <text x="0" y="158" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="36" font-weight="650">Self-hosted subscription</text>
    <text x="0" y="198" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="36" font-weight="650">delivery</text>
    <text x="0" y="246" fill="#475467" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="36" font-weight="600">自托管订阅转换发行栈</text>
  </g>

  <g id="input-convert-share" transform="translate(614 45)">
    <rect width="522" height="270" rx="24" fill="#FFFFFF" fill-opacity="0.72" stroke="#D9E3F5" stroke-width="2"/>

    <g id="input-card" transform="translate(24 61)">
      <rect width="144" height="148" rx="18" fill="#F2F6FF" stroke="#BFD2FF" stroke-width="2"/>
      <rect x="18" y="26" width="44" height="44" rx="13" fill="#2563EB"/>
      <path d="M30 47H50M30 55H45" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <text x="25" y="120" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="40" font-weight="700">Input</text>
    </g>

    <path d="M172 135H184" stroke="url(#flow)" stroke-width="6" stroke-linecap="round"/>
    <path d="M179 126L189 135L179 144" fill="none" stroke="#4B71EB" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <g id="convert-card" transform="translate(192 61)">
      <rect width="164" height="148" rx="18" fill="#F5F1FF" stroke="#D7C7FF" stroke-width="2"/>
      <rect x="18" y="26" width="44" height="44" rx="13" fill="#7457E8"/>
      <path d="M30 49H51M46 42L53 49L46 56" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="4" y="120" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="40" font-weight="700">Convert</text>
    </g>

    <path d="M364 135H376" stroke="url(#flow)" stroke-width="6" stroke-linecap="round"/>
    <path d="M371 126L381 135L371 144" fill="none" stroke="#8B5CF6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <g id="share-card" transform="translate(384 61)">
      <rect width="122" height="148" rx="18" fill="#EEF5FF" stroke="#BFD2FF" stroke-width="2"/>
      <rect x="18" y="26" width="44" height="44" rx="13" fill="#2563EB"/>
      <path d="M32 57L49 40M39 40H49V50M31 58H48" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="4" y="120" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="40" font-weight="700">Share</text>
    </g>
  </g>
</svg>
