<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Subweb - Self-hosted subscription delivery</title>
  <desc id="desc">A self-hosted stack for subscription conversion and short links. The visual traces input to convert to share.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="0.56" stop-color="#F5F8FF"/>
      <stop offset="1" stop-color="#F7F3FF"/>
    </linearGradient>
    <linearGradient id="flow" x1="660" y1="122" x2="1124" y2="266" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="halo" x1="1032" y1="4" x2="850" y2="342" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4EAFE" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#EEE7FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#surface)"/>
  <path d="M0 284C214 226 401 250 578 316V360H0Z" fill="#E9F0FF"/>
  <circle cx="1076" cy="18" r="250" fill="url(#halo)"/>
  <path d="M64 278H536" stroke="#D5E1F5" stroke-width="2"/>

  <g id="title-block" transform="translate(64 58)">
    <rect width="248" height="36" rx="18" fill="#E8F0FF"/>
    <circle cx="19" cy="18" r="6" fill="#2563EB"/>
    <text x="38" y="24" fill="#2563EB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">SELF-HOSTED DELIVERY</text>

    <text x="0" y="112" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="62" font-weight="750">Subweb</text>
    <text x="0" y="154" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="30" font-weight="650">Self-hosted subscription delivery</text>
    <text x="0" y="190" fill="#475467" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="500">自托管订阅转换发行栈</text>
    <text x="0" y="234" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">Convert, shorten, and deliver through one gateway.</text>
    <text x="0" y="260" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">转换、短链与网关统一编排，服务边界清晰。</text>
  </g>

  <g id="input-convert-share" transform="translate(642 45)">
    <rect width="494" height="270" rx="24" fill="#FFFFFF" fill-opacity="0.72" stroke="#D9E3F5" stroke-width="2"/>
    <text x="32" y="47" fill="#667085" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="1.8">ONE FLOW</text>
    <path d="M32 68H462" stroke="#E2E8F5" stroke-width="2"/>

    <g id="input-card" transform="translate(28 96)">
      <rect width="126" height="122" rx="18" fill="#F2F6FF" stroke="#BFD2FF" stroke-width="2"/>
      <rect x="18" y="20" width="38" height="38" rx="12" fill="#2563EB"/>
      <path d="M29 39H45M29 46H41" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="18" y="87" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="700">Input</text>
      <text x="18" y="109" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18">订阅链接</text>
    </g>

    <path d="M166 157H190" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/>
    <path d="M184 149L194 157L184 165" fill="none" stroke="#4B71EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g id="convert-card" transform="translate(206 96)">
      <rect width="126" height="122" rx="18" fill="#F5F1FF" stroke="#D7C7FF" stroke-width="2"/>
      <rect x="18" y="20" width="38" height="38" rx="12" fill="#7457E8"/>
      <path d="M29 40H46M42 34L48 40L42 46" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="87" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="700">Convert</text>
      <text x="18" y="109" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18">目标格式</text>
    </g>

    <path d="M344 157H368" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/>
    <path d="M362 149L372 157L362 165" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g id="share-card" transform="translate(384 96)">
      <rect width="82" height="122" rx="18" fill="#EEF5FF" stroke="#BFD2FF" stroke-width="2"/>
      <rect x="18" y="20" width="38" height="38" rx="12" fill="#2563EB"/>
      <path d="M31 46L44 33M36 33H44V41M30 47H43" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="87" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="700">Share</text>
      <text x="18" y="109" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18">短链</text>
    </g>
  </g>
</svg>
