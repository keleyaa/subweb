services:
  myurls:
    environment:
      NODE_ENV: production
      TURNSTILE_ENABLED: "true"
      TURNSTILE_MODE: cloudflare
      TURNSTILE_SITE_KEY: test-site-key
      TURNSTILE_SECRET_KEY: test-secret-key
      TURNSTILE_HOSTNAME: app.test
      # Exercise the production creation challenge threshold in the smoke test.
      CREATE_DIRECT_LIMIT_10M: "5"
      CREATE_HARD_LIMIT_10M: "20"
      CREATE_HARD_LIMIT_1D: "100"
      TEST_FORCE_CHALLENGE: "false"
